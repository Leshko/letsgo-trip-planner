# Two containers: the app and its PostgreSQL database.
# Put secrets in letsgo.env next to this file (see deploy/README.md), then: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: letsgo-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=letsgo
      - POSTGRES_DB=letsgo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - /mnt/user/appdata/letsgo/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U letsgo -d letsgo']
      interval: 5s
      timeout: 5s
      retries: 20

  letsgo:
    build: .
    image: letsgo-trip-planner:latest
    container_name: letsgo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3001:3001'
    env_file:
      - path: ./letsgo.env
        required: false
    environment:
      - PORT=3001
      - DATA_DIR=/data
      - DB_PATH=/data/letsgo.sqlite
      - DATABASE_URL=postgres://letsgo:${POSTGRES_PASSWORD}@db:5432/letsgo
    volumes:
      - /mnt/user/appdata/letsgo:/data
