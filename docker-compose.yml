# One container; its database is built in. Settings go in letsgo.env next to this
# file (see deploy/README.md), then: docker compose up -d
services:
  letsgo:
    build: .
    image: letsgo-trip-planner:latest
    container_name: letsgo
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - path: ./letsgo.env
        required: false
    volumes:
      - /mnt/user/appdata/letsgo:/data
