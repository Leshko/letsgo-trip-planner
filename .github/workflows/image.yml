name: build image

on:
  push:
    branches: ['main']
    
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/letsgo-trip-planner
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      # Build once, try the real image (upgrade from an old install, restart, hard kill), then publish.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: letsgo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: bash deploy/ci-smoke.sh letsgo:ci

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
